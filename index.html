<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Support Assistant - Demo</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f5f5f7; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: #1d1d1f; 
        }
        .container { 
            text-align: center; 
            padding: 50px; 
            background: white;
            border-radius: 18px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            max-width: 400px;
        }
        h1 { font-size: 2.4rem; font-weight: 600; margin-bottom: 8px; }
        p { font-size: 1.1rem; color: #6e6e73; line-height: 1.5; }
        .hint { font-size: 0.9rem; color: #06c; margin-top: 25px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Support</h1>
        <p>Get help with your favorite Apple products and services.</p>
        <p class="hint">The chat assistant will appear in the bottom right corner after 10 seconds.</p>
    </div>

    <!-- NEW WOTNOT SCRIPT -->
    <script src="https://app.wotnot.io/chat-widget/yUxgAweDhcQL191204075466Y7SnE93u.js" defer></script>
</body>
</html>
